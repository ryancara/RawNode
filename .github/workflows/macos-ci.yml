name: macOS CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ inputs.release_version || 'development' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-selftest:
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.release_version != '' && '["arm64","x86_64"]' || '["arm64"]') }}
        jxl: ["OFF", "ON"]
        exclude:
          - arch: x86_64
            jxl: "ON"
    env:
      ARCHS: ${{ matrix.arch }}
      JXL: ${{ matrix.jxl }}
      BUILD_DIR: build-jxl-${{ matrix.jxl }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      VERSION: ${{ inputs.release_version || '0.0.0' }}
      PACKAGE_NAME: RawNode-macOS-${{ matrix.arch }}-JXL-${{ matrix.jxl }}${{ inputs.release_version && format('-v{0}', inputs.release_version) || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_version != '' && github.event.pull_request.head.sha || github.sha }}

      - name: Install build dependencies
        run: brew install cmake pkg-config jpeg-turbo libtiff little-cms2 openexr python libomp dylibbundler

      - name: Configure clean Release build
        run: |
          rm -rf "$BUILD_DIR"
          cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$ARCHS" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix jpeg-turbo)" \
            -DRAWNODE_ENABLE_JXL_DNG="$JXL" \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp" \
            -DOpenMP_CXX_INCLUDE_DIR="$(brew --prefix libomp)/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="$(brew --prefix libomp)/lib/libomp.dylib"
          grep -Fx "RAWNODE_ENABLE_JXL_DNG:BOOL=$JXL" "$BUILD_DIR/CMakeCache.txt"

      - name: Build
        run: ./build.sh

      - name: Verify native architecture and actual LibRaw OpenMP linkage
        run: |
          test "$(uname -m)" = "$ARCHS"
          binary="$BUILD_DIR/OfxRawHost.app/Contents/MacOS/OfxRawHost"
          file "$binary"
          test "$(lipo -archs "$binary")" = "$ARCHS"
          test "$(lipo -archs "$BUILD_DIR/libRawNodeRaw.a")" = "$ARCHS"
          cat "$BUILD_DIR/CMakeFiles/RawNodeRaw.dir/flags.make"
          grep -F -- '-Xpreprocessor -fopenmp' "$BUILD_DIR/CMakeFiles/RawNodeRaw.dir/flags.make"
          grep -F -- '-DLIBRAW_FORCE_OPENMP' "$BUILD_DIR/CMakeFiles/RawNodeRaw.dir/flags.make"
          # References from compiled LibRaw objects prove its OpenMP code was enabled.
          nm -u "$BUILD_DIR/libRawNodeRaw.a" | grep -E '___kmpc_fork_call|_omp_get_'
          grep -F 'libomp.dylib' "$BUILD_DIR/CMakeFiles/OfxRawHost.dir/link.txt"
          test "$(grep -o 'libRawNodeRaw.a' "$BUILD_DIR/CMakeFiles/OfxRawHost.dir/link.txt" | wc -l | tr -d ' ')" = 1
          otool -L "$binary"
          otool -L "$binary" | grep -F libomp.dylib
          if otool -L "$binary" | grep -iE '/libraw[._]'; then exit 1; fi

      - name: Self-test
        run: |
          "$BUILD_DIR/OfxRawHost.app/Contents/MacOS/OfxRawHost" --selftest

      - name: Assemble and verify portable macOS ZIP
        run: bash .github/scripts/macos-package.sh

      - name: Upload portable macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.BUILD_DIR }}/${{ env.PACKAGE_NAME }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
