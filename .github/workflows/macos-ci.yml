name: macOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-build-selftest:
    # Standard GitHub-hosted Apple Silicon runner; no Intel/Rosetta build.
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        jxl: ["OFF", "ON"]
    env:
      BUILD_DIR: build-jxl-${{ matrix.jxl }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: brew install cmake pkg-config jpeg-turbo libtiff little-cms2 openexr python libomp dylibbundler

      - name: Configure clean Release build
        run: |
          rm -rf "$BUILD_DIR"
          cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix jpeg-turbo)" \
            -DRAWNODE_ENABLE_JXL_DNG=${{ matrix.jxl }} \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp" \
            -DOpenMP_CXX_INCLUDE_DIR="$(brew --prefix libomp)/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="$(brew --prefix libomp)/lib/libomp.dylib"
          grep -x 'RAWNODE_ENABLE_JXL_DNG:BOOL=${{ matrix.jxl }}' "$BUILD_DIR/CMakeCache.txt"

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel 2

      - name: Verify Apple Silicon and actual LibRaw OpenMP linkage
        run: |
          test "$(uname -m)" = arm64
          binary="$BUILD_DIR/OfxRawHost.app/Contents/MacOS/OfxRawHost"
          file "$binary"
          test "$(lipo -archs "$binary")" = arm64
          test "$(lipo -archs "$BUILD_DIR/libRawNodeRaw.a")" = arm64
          cat "$BUILD_DIR/CMakeFiles/RawNodeRaw.dir/flags.make"
          grep -F -- '-Xpreprocessor -fopenmp' "$BUILD_DIR/CMakeFiles/RawNodeRaw.dir/flags.make"
          grep -F -- '-DLIBRAW_FORCE_OPENMP' "$BUILD_DIR/CMakeFiles/RawNodeRaw.dir/flags.make"
          # References from compiled LibRaw objects prove its OpenMP code was enabled.
          nm -u "$BUILD_DIR/libRawNodeRaw.a" | grep -E '___kmpc_fork_call|_omp_get_'
          grep -F 'libomp.dylib' "$BUILD_DIR/CMakeFiles/OfxRawHost.dir/link.txt"
          test "$(grep -o 'libRawNodeRaw.a' "$BUILD_DIR/CMakeFiles/OfxRawHost.dir/link.txt" | wc -l | tr -d ' ')" = 1
          otool -L "$binary"
          otool -L "$binary" | grep -F libomp.dylib
          if otool -L "$binary" | grep -iE '/libraw[._]'; then exit 1; fi

      - name: Self-test
        run: |
          "$BUILD_DIR/OfxRawHost.app/Contents/MacOS/OfxRawHost" --selftest

      - name: Package portable macOS test app
        run: |
          set -euo pipefail
          app="$BUILD_DIR/OfxRawHost.app"
          binary="$app/Contents/MacOS/OfxRawHost"
          mkdir -p "$app/Contents/Frameworks"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>OfxRawHost</string>
            <key>CFBundleIdentifier</key><string>com.aaronmurniadi.ofxrawhost</string>
            <key>CFBundleName</key><string>OFX Raw Host</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0.0</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict></plist>
          PLIST
          # Bundle both direct and transitive Homebrew libraries instead of
          # relying on packages installed on the build/test machine.
          crop="$app/Contents/PlugIns/OfxRawHost.ofx.bundle/Contents/MacOS/OfxRawHost.ofx"
          dylibbundler -ns -b -x "$binary" -x "$crop" \
            -d "$app/Contents/Frameworks" \
            -p '@executable_path/../Frameworks/' \
            -i /System/Library -i /usr/lib
          # dylibbundler can rewrite distinct Homebrew rpaths to the same
          # bundle path. Modern dyld rejects duplicate LC_RPATH entries.
          for file in "$binary" "$crop" "$app"/Contents/Frameworks/*.dylib; do
            duplicates="$(otool -l "$file" | awk '$1 == "cmd" && $2 == "LC_RPATH" {getline; getline; print $2}' | sort | uniq -d)"
            while IFS= read -r rpath; do
              test -n "$rpath" || continue
              while [ "$(otool -l "$file" | awk -v p="$rpath" '$1 == "path" && $2 == p {n++} END {print n+0}')" -gt 1 ]; do
                install_name_tool -delete_rpath "$rpath" "$file"
              done
              if ! otool -l "$file" | awk '$1 == "cmd" && $2 == "LC_RPATH" {getline; getline; print $2}' | grep -Fxq "$rpath"; then
                install_name_tool -add_rpath "$rpath" "$file"
              fi
            done <<< "$duplicates"
          done
          cp "$(brew --prefix libomp)/LICENSE.TXT" "$app/Contents/Resources/RawDependencyNotices/libomp-LICENSE.TXT"
          for lib in "$app"/Contents/Frameworks/*.dylib; do
            codesign --force --sign - "$lib"
          done
          codesign --force --sign - "$app/Contents/PlugIns/OfxRawHost.ofx.bundle"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Reject absolute Homebrew load paths in the app, bundled libraries
          # and bundled OFX module, including transitive library dependencies.
          for file in "$binary" "$crop" "$app"/Contents/Frameworks/*.dylib; do
            if otool -L "$file" | grep -E "^[[:space:]]*/(opt/homebrew|usr/local)/"; then
              echo "Unbundled Homebrew dependency in $file" >&2
              exit 1
            fi
          done
          "$binary" --selftest
          ditto -c -k --sequesterRsrc --keepParent "$app" "$BUILD_DIR/RawNode-macOS-arm64-JXL-${{ matrix.jxl }}.zip"

      - name: Upload portable macOS test build
        uses: actions/upload-artifact@v4
        with:
          name: RawNode-macOS-arm64-JXL-${{ matrix.jxl }}
          path: ${{ env.BUILD_DIR }}/RawNode-macOS-arm64-JXL-${{ matrix.jxl }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
