name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/macos-ci.yml'
      - '.github/workflows/windows-ci.yml'
      - '.github/scripts/macos-package.sh'
      - '.github/scripts/windows-test-zip.ps1'
      - 'build.sh'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'docs/logo.png'
      - 'docs/DISTRIBUTION_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine application version
        id: version
        shell: bash
        env:
          EVENT_DELETED: ${{ github.event.deleted }}
        run: |
          version=0.0.0
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$EVENT_DELETED" == true || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Expected a version tag of the form vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    uses: ./.github/workflows/macos-ci.yml
    with:
      release_version: ${{ needs.version.outputs.version }}

  windows:
    needs: version
    uses: ./.github/workflows/windows-ci.yml
    with:
      release_version: ${{ needs.version.outputs.version }}

  verify-assets:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RawNode-*-v${{ needs.version.outputs.version }}
          path: dist
          merge-multiple: true
      - name: Verify the release asset set
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          for variant in macOS-arm64-JXL-ON macOS-arm64-JXL-OFF macOS-x86_64-JXL-OFF Windows-x64-JXL-OFF; do
            asset="RawNode-$variant-v$VERSION.zip"
            unzip -tq "$asset"
            echo "- \`$asset\`" >> "$GITHUB_STEP_SUMMARY"
          done
          files=(*)
          test "${#files[@]}" -eq 4

  publish:
    needs: [version, verify-assets]
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.deleted == false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: RawNode-*-v${{ needs.version.outputs.version }}
          path: dist
          merge-multiple: true
      - name: Publish the verified ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=()
          if [[ -f "docs/releases/$GITHUB_REF_NAME.md" ]]; then
            notes=(--notes-file "docs/releases/$GITHUB_REF_NAME.md")
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes "${notes[@]}" dist/*.zip
