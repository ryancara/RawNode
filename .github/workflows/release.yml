name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 (Apple Silicon)
          - os: macos-15
            arch: arm64
          # x86_64 (Intel) — macos-13 is retired; use macos-15-intel
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: brew install cmake jpeg-turbo libtiff little-cms2 openexr libomp
      - name: Build and package DMG
        run: |
          rm -rf build
          # build.sh preserves this CMake cache but does not forward arbitrary options.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_PREFIX_PATH="$(brew --prefix jpeg-turbo)" \
            -DRAWNODE_ENABLE_JXL_DNG=OFF \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp" \
            -DOpenMP_CXX_INCLUDE_DIR="$(brew --prefix libomp)/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="$(brew --prefix libomp)/lib/libomp.dylib"
          app_version=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            app_version="${GITHUB_REF_NAME#v}"
          fi
          ARCHS=${{ matrix.arch }} VERSION="$app_version" ./build.sh
          grep -x 'RAWNODE_ENABLE_JXL_DNG:BOOL=OFF' build/CMakeCache.txt
          cat build/CMakeFiles/RawNodeRaw.dir/flags.make
          grep -F -- '-Xpreprocessor -fopenmp' build/CMakeFiles/RawNodeRaw.dir/flags.make
          grep -F -- '-DLIBRAW_FORCE_OPENMP' build/CMakeFiles/RawNodeRaw.dir/flags.make
          grep -F -- '-DRAWNODE_ENABLE_JXL_DNG=0' build/CMakeFiles/RawNodeRaw.dir/flags.make
          nm -u build/libRawNodeRaw.a | grep -E '___kmpc_fork_call|_omp_get_'
          grep -F 'libomp.dylib' build/CMakeFiles/OfxRawHost.dir/link.txt
          # Bundle the newly explicit OpenMP runtime, then repair its load path/signatures.
          app=build/OfxRawHost.app
          binary="$app/Contents/MacOS/OfxRawHost"
          omp_prefix="$(brew --prefix libomp)"
          omp_ref="$(otool -L "$binary" | awk '$1 ~ /libomp[.]dylib$/ {print $1}')"
          test -n "$omp_ref"
          mkdir -p "$app/Contents/Frameworks"
          cp -L "$omp_prefix/lib/libomp.dylib" "$app/Contents/Frameworks/libomp.dylib"
          cp "$omp_prefix/LICENSE.TXT" "$app/Contents/Resources/RawDependencyNotices/libomp-LICENSE.TXT"
          chmod u+w "$app/Contents/Frameworks/libomp.dylib"
          install_name_tool -id '@rpath/libomp.dylib' "$app/Contents/Frameworks/libomp.dylib"
          install_name_tool -change "$omp_ref" '@executable_path/../Frameworks/libomp.dylib' "$binary"
          codesign --force --sign - "$app/Contents/Frameworks/libomp.dylib"
          codesign --verify --strict --verbose=2 "$app/Contents/Frameworks/libomp.dylib"
          # build.sh signed the nested OFX bundle; verify it before re-signing the parent.
          codesign --verify --strict --verbose=2 "$app/Contents/PlugIns/OfxRawHost.ofx.bundle"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(lipo -archs "$app/Contents/Frameworks/libomp.dylib")" = '${{ matrix.arch }}'
          otool -L "$binary" | grep -F '@executable_path/../Frameworks/libomp.dylib'
          otool -L "$app/Contents/Frameworks/libomp.dylib"
          "$binary" --selftest
          # Verify binary arch matches the matrix target
          lipo -info build/OfxRawHost.app/Contents/MacOS/OfxRawHost | tee /dev/stderr | grep -q "${{ matrix.arch }}"
          mkdir -p build/dmg
          cp -R build/OfxRawHost.app build/dmg/
          ln -sf /Applications build/dmg/Applications
          hdiutil create -volname "OFX Raw Host" -srcfolder build/dmg -format UDZO -ov \
            "build/OfxRawHost-macOS-${{ matrix.arch }}.dmg"
          # Validate the application inside the finished image, not only build/.
          mountpoint="$(mktemp -d)"
          hdiutil attach "build/OfxRawHost-macOS-${{ matrix.arch }}.dmg" \
            -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          packaged_app="$mountpoint/OfxRawHost.app"
          packaged_binary="$packaged_app/Contents/MacOS/OfxRawHost"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$packaged_app/Contents/Info.plist")" = "$app_version"
          test -f "$packaged_app/Contents/Frameworks/libomp.dylib"
          test -f "$packaged_app/Contents/Resources/RawDependencyNotices/libomp-LICENSE.TXT"
          codesign --verify --strict --verbose=2 "$packaged_app/Contents/PlugIns/OfxRawHost.ofx.bundle"
          codesign --verify --strict --verbose=2 "$packaged_app/Contents/Frameworks/libomp.dylib"
          codesign --verify --deep --strict --verbose=2 "$packaged_app"
          test "$(lipo -archs "$packaged_binary")" = '${{ matrix.arch }}'
          test "$(lipo -archs "$packaged_app/Contents/Frameworks/libomp.dylib")" = '${{ matrix.arch }}'
          otool -L "$packaged_binary" | grep -F '@executable_path/../Frameworks/libomp.dylib'
          "$packaged_binary" --selftest
          hdiutil detach "$mountpoint"
          trap - EXIT
          rmdir "$mountpoint"
      - uses: actions/upload-artifact@v4
        with:
          name: OfxRawHost-macOS-${{ matrix.arch }}
          path: build/OfxRawHost-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PREV=$(git tag --sort=-v:refname | awk -v t="$TAG" '$0 != t { print; exit }')
          NOTES=$(mktemp)
          {
            if [ -f "docs/releases/${TAG}.md" ]; then
              cat "docs/releases/${TAG}.md"
              echo
            fi
            echo "## Downloads"
            echo
            echo "- **Apple Silicon:** \`OfxRawHost-macOS-arm64.dmg\`"
            echo "- **Intel:** \`OfxRawHost-macOS-x86_64.dmg\`"
            echo
            if [ -n "${PREV:-}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" dist/OfxRawHost-macOS-*.dmg --clobber
