name: Windows Trash safety

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-trash-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-build-test:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile production Windows adapter and fail-closed regression
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $command = "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 && cl.exe /nologo /std:c++17 /EHsc /O2 /W4 /WX /I src tests\WindowsTrashTests.cpp src\platform\FileTrash.cpp /Fe:WindowsTrashTests.exe"
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Native Windows compilation failed: $LASTEXITCODE" }

      - name: Verify Windows Trash refuses and preserves originals
        shell: pwsh
        run: |
          ./WindowsTrashTests.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows Trash regression failed: $LASTEXITCODE" }
