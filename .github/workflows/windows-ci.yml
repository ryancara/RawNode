name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc-x64-build-selftest:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openexr:x64-windows tiff:x64-windows lcms:x64-windows libjpeg-turbo:x64-windows zlib:x64-windows --x-install-root="$pwd/native-deps/vcpkg"

      - name: Configure Release x64 with JPEG XL disabled
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_INSTALLED_DIR=$pwd/native-deps/vcpkg"
          -DRAWNODE_ENABLE_JXL_DNG=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Self-test
        run: ./build/Release/OfxRawHost.exe --selftest

      - name: Assemble and verify portable test ZIP
        shell: pwsh
        run: ./.github/scripts/windows-test-zip.ps1

      - name: Upload portable test build
        uses: actions/upload-artifact@v4
        with:
          name: RawNode-Windows-x64-Release
          path: ${{ runner.temp }}/rawnode-windows-artifact/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
