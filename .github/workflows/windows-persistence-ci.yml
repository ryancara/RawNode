name: Windows persistence
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-persistence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-persistence:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: glfw/glfw
          ref: '3.4'
          path: native-deps/glfw
      - uses: actions/checkout@v4
        with:
          repository: ocornut/imgui
          ref: v1.91.8-docking
          path: native-deps/imgui
      - name: Configure actual production persistence and shared sidecar tests
        run: cmake -S tests/windows-persistence -B build-persistence -A x64
      - name: Compile with MSVC C++17
        run: cmake --build build-persistence --config Release --parallel 2
      - name: Run production persistence regressions
        shell: pwsh
        run: |
          ./build-persistence/Release/WindowsPersistenceTests.exe
          if ($LASTEXITCODE -ne 0) { throw "Native production persistence failed: $LASTEXITCODE" }
      - name: Repeat production regressions as an ordinary user
        shell: pwsh
        run: |
          $name = 'RawNodePersist'
          $secret = ConvertTo-SecureString ([guid]::NewGuid().ToString('N') + '!Aa9') -AsPlainText -Force
          $account = New-LocalUser -Name $name -Password $secret -AccountNeverExpires
          try {
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $account
            $base = Join-Path $env:RUNNER_TEMP ('rawnode-user-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory $base | Out-Null
            & icacls.exe $base /grant "${name}:(OI)(CI)M"
            $credential = [pscredential]::new("$env:COMPUTERNAME\$name", $secret)
            $process = Start-Process -FilePath "$pwd\build-persistence\Release\WindowsPersistenceTests.exe" -ArgumentList "--ordinary-user `"$base`"" -Credential $credential -WorkingDirectory $base -Wait -PassThru -RedirectStandardOutput "$pwd\ordinary-user.log" -RedirectStandardError "$pwd\ordinary-user.err"
            Get-Content ordinary-user.log,ordinary-user.err
            if ($process.ExitCode -ne 0) { throw "Ordinary-user production persistence failed: $($process.ExitCode)" }
          } finally {
            Remove-LocalUser -Name $name -ErrorAction SilentlyContinue
          }
