name: Windows persistence
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-persistence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-persistence:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: glfw/glfw
          ref: '3.4'
          path: native-deps/glfw
      - uses: actions/checkout@v4
        with:
          repository: ocornut/imgui
          ref: v1.91.8-docking
          path: native-deps/imgui
      - name: Native environment and decoder dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | ConvertTo-Json | Set-Content evidence/os.json
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' | Select-Object CurrentBuildNumber,UBR,DisplayVersion | ConvertTo-Json | Set-Content evidence/os-revision.json
          Get-Volume | Select-Object DriveLetter,FileSystem,DriveType | ConvertTo-Json | Set-Content evidence/volumes.json
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install tiff:x64-windows lcms:x64-windows libjpeg-turbo:x64-windows zlib:x64-windows --x-install-root="$pwd/native-deps/vcpkg" 2>&1 | Tee-Object evidence/dependencies.txt
          if ($LASTEXITCODE -ne 0) { throw 'Decoder dependency build failed' }
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" list --x-install-root="$pwd/native-deps/vcpkg" | Set-Content evidence/dependency-versions.txt
      - name: Configure actual production persistence and image components
        run: cmake -S tests/windows-persistence -B build-persistence -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_INSTALLED_DIR=$pwd/native-deps/vcpkg"
      - name: Compile with MSVC C++17
        run: cmake --build build-persistence --config Release --parallel 2
      - name: Run production regressions and code-page guard
        shell: pwsh
        run: |
          ./build-persistence/Release/WindowsCodePageTests.exe --check-codepage
          if ($LASTEXITCODE -ne 0) { throw 'Unmanifested application was not refused' }
          ./build-persistence/Release/WindowsPersistenceTests.exe 2>&1 | Tee-Object evidence/runner.txt
          if ($LASTEXITCODE -ne 0) { throw "Native production persistence failed: $LASTEXITCODE" }
      - name: Ordinary-user production regressions and disposable local filesystems
        shell: pwsh
        run: |
          $name = 'RawNodePersist'
          $secret = ConvertTo-SecureString ([guid]::NewGuid().ToString('N') + '!Aa9') -AsPlainText -Force
          $account = New-LocalUser -Name $name -Password $secret -AccountNeverExpires
          $other = New-LocalUser -Name RawNodeOther -Password $secret -AccountNeverExpires
          $exe = "$pwd\build-persistence\Release\WindowsPersistenceTests.exe"
          $base = Join-Path $env:RUNNER_TEMP ('rawnode-user-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $base | Out-Null
          try {
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $account,$other
            & icacls.exe $base /grant "${name}:(OI)(CI)M" "$($other.Name):(OI)(CI)M"
            $credential = [pscredential]::new("$env:COMPUTERNAME\$name", $secret)
            $fixtures = Join-Path $base 'prepared'
            $producer = [pscredential]::new("$env:COMPUTERNAME\$($other.Name)", $secret)
            $created = Start-Process $exe -ArgumentList "--produce-photo `"$fixtures`"" -Credential $producer -LoadUserProfile -WorkingDirectory $base -Wait -PassThru -RedirectStandardOutput "$pwd\evidence\other-account.txt" -RedirectStandardError "$pwd\evidence\other-account.err"
            if ($created.ExitCode -ne 0) { throw 'Other-account photograph and sidecar production failed' }
            & $exe --prepare $fixtures $account.SID.Value $other.SID.Value
            if ($LASTEXITCODE -ne 0) { throw 'Privileged disposable fixture preparation failed' }
            $process = Start-Process $exe -ArgumentList "--ordinary-user `"$base`" `"$fixtures`"" -Credential $credential -LoadUserProfile -WorkingDirectory $base -Wait -PassThru -RedirectStandardOutput "$pwd\evidence\ordinary-user.txt" -RedirectStandardError "$pwd\evidence\ordinary-user.err"
            Get-Content evidence/ordinary-user.txt,evidence/ordinary-user.err
            if ($process.ExitCode -ne 0) { throw "Ordinary-user regressions failed: $($process.ExitCode)" }
            & $exe --verify-audits $fixtures
            if ($LASTEXITCODE -ne 0) { throw 'Independent audit observation failed' }
            $share = 'RawNodeView'
            try {
              New-SmbShare -Name $share -Path $fixtures -FullAccess "$env:COMPUTERNAME\$name" | Out-Null
              $process = Start-Process $exe -ArgumentList "--readonly-location `"\\localhost\$share`"" -Credential $credential -LoadUserProfile -WorkingDirectory $base -Wait -PassThru -RedirectStandardOutput "$pwd\evidence\readonly-network.txt" -RedirectStandardError "$pwd\evidence\readonly-network.err"
              Get-Content evidence/readonly-network.txt,evidence/readonly-network.err
              if ($process.ExitCode -ne 0) { throw 'Reading supported grades on write-unqualified storage failed' }
            } finally { Remove-SmbShare -Name $share -Force -ErrorAction SilentlyContinue }
            foreach ($filesystem in @('NTFS','FAT32','exFAT')) {
              $vhd = Join-Path $base "$filesystem.vhd"
              $drive = @('Z','Y','X','W') | Where-Object { -not (Test-Path "${_}:\") } | Select-Object -First 1
              try {
                @("create vdisk file=`"$vhd`" maximum=128 type=expandable", "select vdisk file=`"$vhd`"", 'attach vdisk', 'create partition primary', "format fs=$filesystem quick label=RNTest", "assign letter=$drive") | Set-Content "$base\diskpart.txt"
                diskpart /s "$base\diskpart.txt" | Tee-Object "evidence/vhd-$filesystem.txt"
                if (-not (Test-Path "${drive}:\")) { throw "$filesystem fixture volume unavailable" }
                $root = "${drive}:\RawNodeTests"
                New-Item -ItemType Directory $root | Out-Null
                if ($filesystem -eq 'NTFS') { & icacls.exe $root /grant "${name}:(OI)(CI)M" }
                $process = Start-Process $exe -ArgumentList "--volume `"$base`" `"$root`"" -Credential $credential -LoadUserProfile -WorkingDirectory $base -Wait -PassThru -RedirectStandardOutput "$pwd\evidence\volume-$filesystem.txt" -RedirectStandardError "$pwd\evidence\volume-$filesystem.err"
                Get-Content "evidence/volume-$filesystem.txt","evidence/volume-$filesystem.err"
                if ($process.ExitCode -ne 0) { throw "$filesystem production regressions failed: $($process.ExitCode)" }
              } finally {
                @("select vdisk file=`"$vhd`"", 'detach vdisk') | Set-Content "$base\detach.txt"
                diskpart /s "$base\detach.txt"
                Remove-Item $vhd -ErrorAction SilentlyContinue
              }
            }
          } finally {
            Remove-LocalUser -Name $name -ErrorAction SilentlyContinue
            Remove-LocalUser -Name RawNodeOther -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force $base -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-production-persistence
          path: evidence
